<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسبحة 14 معصوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0f2116;margin:0;padding:10px;color:#fff}
.top{background:#d4b45a;color:#000;border-radius:20px;padding:12px 18px;display:flex;justify-content:space-between;font-weight:900;margin-bottom:12px}
.card{background:#1a331f;border:1px solid #2d5a33;border-radius:20px;padding:14px;margin-bottom:12px;text-align:center}
.num{font-size:42px;color:#f7d25a;font-weight:900}
.tot{font-size:30px;color:#f7d25a;font-weight:900}
.bar{height:12px;background:#0a1a0a;border-radius:10px;overflow:hidden;margin-top:10px}
.fill{height:100%;background:#f7d25a;width:0%}
.btn{background:#2e7d32;color:#fff;border:none;width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:19px;margin-top:10px}
.badge{background:#122912;color:#4ade80;padding:8px;border-radius:12px;margin-top:8px;border:1px solid #2a5a2a}
</style>
</head>
<body>
<div class="top"><span>جلستك: <span id="sess">107</span></span><span>تسبيحك: <span id="my">1994</span></span></div>

<div class="card">
<div>المجموع الكلي</div>
<div class="tot"><span id="total">4077</span> / 14000</div>
<div class="bar"><div id="tbar" class="fill" style="width:29%"></div></div>
<div style="color:#f7d25a;font-weight:900;margin-top:8px">✅ ختمات 14000 مكتملة: <span id="big">1</span></div>
<div style="color:#4ade80">مجموع الختمات: 1 ختمة</div>
</div>

<div id="list"></div>

<script>
const names=["النبي محمد صلى الله عليه وآله وسلم","الإمام علي عليه السلام","فاطمة الزهراء عليها السلام","الإمام الحسن عليه السلام","الإمام الحسين عليه السلام","الإمام السجاد عليه السلام","الإمام الباقر عليه السلام","الإمام الصادق عليه السلام","الإمام الكاظم عليه السلام","الإمام الرضا عليه السلام","الإمام الجواد عليه السلام","الإمام الهادي عليه السلام","الإمام العسكري عليه السلام","الإمام المهدي عجل الله فرجه"];
let counts=JSON.parse(localStorage.getItem('counts')||'[33,538,400,350,300,290,310,330,300,280,270,290,260,276]');
let khat=JSON.parse(localStorage.getItem('khat')||'[1,0,0,0,0,0]');
let big=1;

function save(){localStorage.setItem('counts',JSON.stringify(counts));localStorage.setItem('khat',JSON.stringify(khat));}

function draw(){
 let total=counts.reduce((a,b)=>a+b,0);
 if(total>=14000){big++;counts=Array(14).fill(0);alert('اكتملت ختمة 14000 رقم '+big+' 🎉');}
 document.getElementById('total').innerText=total;
 document.getElementById('tbar').style.width=(total/140)+'%';
 document.getElementById('big').innerText=big;
 let html='';
 for(let i=0;i<14;i++){
  if(counts[i]>=1000){counts[i]=0;khat[i]++;}
  html+=`<div class="card"><div style="font-weight:900">${names[i]}</div><div>${counts[i]} / 1000</div><div class="num">${counts[i]}</div><div class="bar"><div class="fill" style="width:${counts[i]/10}%"></div></div><div class="badge">✅ ختمات مكتملة: ${khat[i]}</div><button class="btn" onclick="add(${i})">+1 صلوات</button></div>`;
 }
 document.getElementById('list').innerHTML=html;
 save();
}
window.add=(i)=>{counts[i]++;let s=parseInt(localStorage.getItem('sess')||'107')+1;let m=parseInt(localStorage.getItem('my')||'1994')+1;localStorage.setItem('sess',s);localStorage.setItem('my',m);document.getElementById('sess').innerText=s;document.getElementById('my').innerText=m;draw();}
draw();
document.getElementById('sess').innerText=localStorage.getItem('sess')||'107';
document.getElementById('my').innerText=localStorage.getItem('my')||'1994';
</script>
</body>
</html>
