<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسبحة 14 معصوم</title>
<style>
body{background:#121f12;color:#fff;font-family:Tajawal,system-ui;text-align:center;margin:0;padding:12px}
.top{background:#c8a94a;color:#000;border-radius:20px;padding:10px 16px;display:flex;justify-content:space-between;font-weight:bold}
.card{background:#1d341d;border:1px solid #2f552f;border-radius:22px;padding:16px;margin-bottom:14px}
.total{font-size:36px;color:#f7d25a;font-weight:900;direction:ltr}
.progress{height:10px;background:#0e1e0e;border-radius:10px;overflow:hidden;margin-top:10px}
.fill{height:100%;background:#f7d25a;width:0%;transition:.3s}
.badge{background:#143214;color:#55d67c;border-radius:12px;padding:8px;font-weight:bold;margin-top:10px;display:block;border:1px solid #2a5a2a}
.btn{background:#2a7a2e;color:#fff;border:none;width:100%;padding:14px;border-radius:14px;font-size:20px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><span id="sess">جلستك: 0</span><span id="my">تسبيحك: 0</span></div>
<div class="card">
<div>المجموع الكلي</div>
<div class="total"><span id="totalNow">0</span> / 14000</div>
<div class="progress"><div id="totalFill" class="fill"></div></div>
<div class="badge" id="bigBadge">✅ ختمات مكتملة: 0</div>
<div style="color:#7ed67e;font-size:13px;margin-top:5px">مجموع الختمات: <span id="bigText">0 ختمة</span></div>
</div>
<div id="list"></div>
<script>
const NAMES=["النبي محمد صلى الله عليه وآله وسلم","الإمام علي عليه السلام","فاطمة الزهراء عليها السلام","الإمام الحسن عليه السلام","الإمام الحسين عليه السلام","الإمام السجاد عليه السلام","الإمام الباقر عليه السلام","الإمام الصادق عليه السلام","الإمام الكاظم عليه السلام","الإمام الرضا عليه السلام","الإمام الجواد عليه السلام","الإمام الهادي عليه السلام","الإمام العسكري عليه السلام","الإمام المهدي عجل الله فرجه"];
let data=JSON.parse(localStorage.getItem('tasbih14')||'{}');let big=parseInt(localStorage.getItem('bigKhatma14')||'0');let my=parseInt(localStorage.getItem('myCount')||'0');let sess=parseInt(localStorage.getItem('sess')||'0');
function save(){localStorage.setItem('tasbih14',JSON.stringify(data));localStorage.setItem('bigKhatma14',big);localStorage.setItem('myCount',my);localStorage.setItem('sess',sess);render();}
function render(){let total=0;let html='';NAMES.forEach((n,i)=>{let v=data[i]||0;total+=v;let k=parseInt(localStorage.getItem('k_'+i)||'0');let p=Math.min(100,v/10);html+=`<div class=card><b>${n}</b><div>${v} / 1000</div><div style="font-size:40px;color:#f7d25a;font-weight:900">${v}</div><div class=progress><div class=fill style="width:${p}%"></div></div><div class=badge>✅ ختمات مكتملة: ${k}</div><button class=btn onclick="add(${i})">+1 صلوات</button></div>`;});if(total>=14000){big++;localStorage.setItem('bigKhatma14',big);alert('اكتملت ختمة الـ 14000 رقم '+big+' 🎉');NAMES.forEach((_,i)=>{data[i]=0;});total=0;localStorage.setItem('tasbih14',JSON.stringify(data));}document.getElementById('totalNow').innerText=total;document.getElementById('totalFill').style.width=(total/140)+'%';document.getElementById('bigBadge').innerText='✅ ختمات مكتملة: '+big;document.getElementById('bigText').innerText=big+' ختمة';document.getElementById('my').innerText='تسبيحك: '+my;document.getElementById('sess').innerText='جلستك: '+sess;document.getElementById('list').innerHTML=html;}
function add(i){let v=data[i]||0;v++;my++;sess++;if(v>=1000){let k=parseInt(localStorage.getItem('k_'+i)||'0')+1;localStorage.setItem('k_'+i,k);v=0;}data[i]=v;save();}
render();
</script>
</body>
</html>
