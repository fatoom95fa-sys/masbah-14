<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسبحة 14</title>
<style>
body{font-family:tahoma;text-align:center;background:#fdf6f0;margin:0;padding:20px}
.total-box{background:#fff;border:2px solid #d4a574;border-radius:15px;padding:15px;margin:15px auto;max-width:400px;font-size:18px}
.counter{font-size:90px;margin:20px;color:#8b4513}
button.main{font-size:28px;padding:20px 60px;border-radius:50px;background:#d4a574;border:none;color:white;cursor:pointer}
button.reset{margin-top:15px;background:#eee;border:none;padding:8px 20px;border-radius:10px}
.ehdaa{margin-top:25px;background:#fff;padding:15px;border-radius:15px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.8;font-size:15px;border:1px solid #e0c9a6}
</style>
</head>
<body>

<div class="total-box">
العداد العام للجميع: <span id="globalCount">0</span>
</div>

<h2>مسبحة الصلوات</h2>
<div class="counter" id="count">0</div>

<button class="main" onclick="tasbeeh()">سبح</button>
<br>
<button class="reset" onclick="resetCounter()">تصفير</button>

<div class="ehdaa">
إهداء ثواب هذه الصلوات إلى الأنبياء والمرسلين والأولياء الصالحين وإلى أهل البيت صلوات الله عليهم وإلى جميع موتانا وموتى المؤمنين والمؤمنات والمسلمين والمسلمات الأحياء منهم والأموات من الأولين والآخرين
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDummy", // سيعمل بنفس مشروعك القديم بدون تغيير
  authDomain: "masbah-14.firebaseapp.com",
  databaseURL: "https://masbah-14-default-rtdb.firebaseio.com",
  projectId: "masbah-14",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let count = parseInt(localStorage.getItem('myCount')||'0');
document.getElementById('count').innerText = count;

function tasbeeh(){
  count++;
  if(count>=1000){count=0;}
  localStorage.setItem('myCount',count);
  document.getElementById('count').innerText=count;
  db.ref('total').transaction(c=>(c||0)+1);
}
function resetCounter(){
  count=0;
  localStorage.setItem('myCount','0');
  document.getElementById('count').innerText=0;
}
db.ref('total').on('value',snap=>{
  document.getElementById('globalCount').innerText=snap.val()||0;
});
</script>
</body>
</html>
