<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسبحة 14 معصوم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap');
body{margin:0;padding:15px;background:#0f251a;color:#fff;font-family:'Tajawal',tahoma;text-align:center}
h1{color:#ffde59;font-size:32px;margin:10px 0;font-weight:700}
.live{border:1px solid #2ecc71;color:#2ecc71;border-radius:25px;padding:7px 18px;display:inline-block;font-size:14px;margin-bottom:18px}
.card{background:#1c3526;border:1.5px solid #d4b44a;border-radius:18px;padding:18px;margin:14px auto;max-width:480px}
.ehdaa-title{font-size:16px;margin-bottom:6px}
.ehdaa-text{font-size:15px;line-height:1.9;color:#e6e6e6}
.name{font-size:18px;margin-bottom:8px}
.count{font-size:48px;color:#ffde59;font-weight:700;margin:8px 0}
.progress{height:10px;background:#00000055;border-radius:10px;margin:12px 0;overflow:hidden;position:relative}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#ffde59,#ffb700);border-radius:10px;transition:0.3s}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btns button{border:none;border-radius:14px;padding:10px 22px;font-size:16px;font-weight:700;color:#fff;cursor:pointer}
.b1{background:#2e8a4a}.b10{background:#1e8ecf}.b50{background:#f08a1a}.b100{background:#d13a2e}
.bminus{background:#3a3a3a;padding:9px 30px !important;border-radius:14px;border:none;color:#fff;font-size:16px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>

<h1>💞 مسبحة 14 معصوم 💞</h1>
<div class="live">LIVE ● مشتركة لحظياً - كل من يسبح يظهر عند الجميع</div>

<div class="card">
<div class="ehdaa-title">🕊️ الإهداء</div>
<div class="ehdaa-text">
<br>  نهدي ثوابها إلى:
- الأنبياء والأوصياء والصالحين
 - وأمواتنا وأمواتكم وأموات المؤمنين والمؤمنات
-والمسلمين والمسلمات
 من الأولين والأخرين
 - وبنية شفاء المرضى 🤲🏻
<br>- قضاء الحوائج
</div>
</div>

<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const names=[
"النبي محمد صلى الله عليه وآله وسلم",
"الإمام علي عليه السلام",
"السيدة فاطمة الزهراء عليها السلام",
"الإمام الحسن عليه السلام",
"الإمام الحسين عليه السلام",
"الإمام السجاد عليه السلام",
"الإمام الباقر عليه السلام",
"الإمام الصادق عليه السلام",
"الإمام الكاظم عليه السلام",
"الإمام الرضا عليه السلام",
"الإمام الجواد عليه السلام",
"الإمام الهادي عليه السلام",
"الإمام العسكري عليه السلام",
"الإمام المهدي عجل الله فرجه"
];

const firebaseConfig={databaseURL:"https://masbah-14-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const list=document.getElementById('list');
let h="";
names.forEach((n,i)=>{
 h+=`
 <div class="card">
  <div class="name">${n}</div>
  <div class="count" id="c${i}">0</div>
  <div class="progress"><span id="p${i}" style="width:5%"></span></div>
  <div class="btns">
   <button class="b1" onclick="add(${i},1)">+1</button>
  </div>
  <button class="bminus" onclick="add(${i},-1)">-1</button>
 </div>`;
});
list.innerHTML=h;

function add(idx,num){
 db.ref('masbah/'+idx).transaction(c=>{
  let v=(c||0)+num;
  if(v<0)v=0;
  return v;
 });
}

names.forEach((_,i)=>{
 db.ref('masbah/'+i).on('value',s=>{
  let v=s.val()||0;
  document.getElementById('c'+i).innerText=v;
  let per = v>100?100:v;
  if(v>0 && per<5)per=5;
  document.getElementById('p'+i).style.width=per+"%";
 });
});
</script>
</body>
</html>
