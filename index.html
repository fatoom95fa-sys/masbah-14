<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسبحة 14 معصوم</title>
<style>
body{background:#081a15;color:white;font-family:Tahoma;text-align:center;padding:15px;margin:0}
h1{color:#ffd700}
.card{background:#132e26;border-radius:20px;padding:16px;margin:14px auto;max-width:420px;border:1px solid #204e3a}
.count{font-size:32px;font-weight:bold;color:#ffd700;margin:8px}
.count span{color:#fff;font-size:18px}
.progress{height:14px;background:#081a15;border-radius:10px;overflow:hidden;margin:12px 0;border:1px solid #204e3a}
.fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff9800);width:0%;transition:0.4s}
button{border:none;padding:10px 14px;margin:4px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px}
.b1{background:#2e7d32;color:#fff}
.b10{background:#0288d1;color:#fff}
.b50{background:#ef6c00;color:#fff}
.b100{background:#c62828;color:#fff}
h2{font-size:16px;margin:5px}
</style>
</head>
<body>
<h1>📿 مسبحة 14 معصوم</h1>
<div id="box"></div>
<script>
const NS="masbah-14-v4-fixed";
const names=["النبي محمد ﷺ","الإمام علي عليه السلام","فاطمة الزهراء عليها السلام","الإمام الحسن عليه السلام","الإمام الحسين عليه السلام","الإمام السجاد عليه السلام","الإمام الباقر عليه السلام","الإمام الصادق عليه السلام","الإمام الكاظم عليه السلام","الإمام الرضا عليه السلام","الإمام الجواد عليه السلام","الإمام الهادي عليه السلام","الإمام العسكري عليه السلام","الإمام المهدي عجل الله فرجه"];
const box=document.getElementById("box");
names.forEach((n,i)=>{
 box.innerHTML+=`<div class="card"><h2>${n}</h2><div class="count" id="c${i}">0 <span>/ 1000</span></div><div class="progress"><div class="fill" id="f${i}"></div></div><div><button class="b1" onclick="add(${i},1)">+1</button><button class="b10" onclick="add(${i},10)">+10</button><button class="b50" onclick="add(${i},50)">+50</button><button class="b100" onclick="add(${i},100)">+100</button></div></div>`;
});
function ui(i,v){
 if(isNaN(v)||v==null) v=0;
 let m = v % 1000;
 document.getElementById("c"+i).innerHTML=`${m} <span>/ 1000</span>`;
 document.getElementById("f"+i).style.width=(m/10)+"%";
}
async function load(i){
 try{
  let r=await fetch(`https://abacus.jasoncameron.dev/get/${NS}/m${i}`);
  let d=await r.json();
  let val = d.value || 0;
  ui(i,val);
 }catch{ ui(i,0); }
}
async function add(i,num){
 let el=document.getElementById("c"+i);
 let curText = el.innerText.split("/")[0].trim();
 let cur = parseInt(curText)||0;
 ui(i,cur+num);
 // نرسل للسيرفر
 fetch(`https://abacus.jasoncameron.dev/hit/${NS}/m${i}?by=${num}`).then(r=>r.json()).then(d=>ui(i,d.value));
}
names.forEach((_,i)=>load(i));
</script>
</body>
</html>
